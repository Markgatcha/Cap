name: arm64 swap bench

on:
  push:
    branches: [perf/arm-bench]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -m
          lscpu | sed -n '1,14p'

      - uses: dtolnay/rust-toolchain@stable

      - name: Toolchain
        run: |
          rustc -vV
          cargo --version

      - name: Assemble a crate around frame.rs and the PR bench
        run: |
          mkdir -p /tmp/bench/src /tmp/bench/benches
          cp apps/desktop-gpui/kernels/src/frame.rs /tmp/bench/src/lib.rs
          cp apps/desktop-gpui/kernels/benches/swap_red_blue.rs /tmp/bench/benches/swap_red_blue.rs
          cp .arm-bench/Cargo.toml /tmp/bench/Cargo.toml
          head -n 5 /tmp/bench/src/lib.rs

      - name: Bench
        working-directory: /tmp/bench
        run: cargo bench --bench swap_red_blue
